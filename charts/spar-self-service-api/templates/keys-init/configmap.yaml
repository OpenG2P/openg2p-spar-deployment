{{- if and .Values.keysInit.enabled .Values.keysInit.startUpCommand }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" . }}-keys-init
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
data:
  {{- if .Values.keysInit.startUpCommand }}
  startup-command: |-
    {{- include "common.tplvalues.render" (dict "value" .Values.keysInit.startUpCommand "context" $) | nindent 4 }}
  {{- end }}
{{- end }}
