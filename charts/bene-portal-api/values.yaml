global:
  benePortalHostname: spar-bene-portal.openg2p.sandbox.net

  sparDbUsername: "postgres"
  sparDbHostname: "spar-postgresql"
  sparDbPort: "5432"
  sparDbName: "spardb"
  sparDbSecretName: "spar-postgresql"

replicaCount: 1
image:
  repository: openg2p/openg2p-spar-bene-portal-api
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "2.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

openapiRootPath: /api/bene-portal

envVars:
  SPAR_BENE_PORTAL_API_DB_DBNAME: {{ .Values.sparDbName }}
  SPAR_BENE_PORTAL_API_DB_HOSTNAME: '{{ tpl .Values.postgresqlInstallationName $ }}'
  SPAR_BENE_PORTAL_API_DB_PORT: {{ .Values.sparDbPort }}
  SPAR_BENE_PORTAL_API_DB_USERNAME: {{ .Values.sparDbUsername }}

envVarsFrom:
  SPAR_BENE_PORTAL_API_DB_PASSWORD:
    secretKeyRef:
      name: '{{ tpl .Values.postgresqlInstallationName $ }}'
      key: password

containerPort: 8000

service:
  type: ClusterIP
  port: 80

resources: {}
  #  requests:
  #    cpu: 500m
  #    memory: 2G

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

readinessProbe:
  httpGet:
    path: /ping
    port: 8000
  failureThreshold: 20
  periodSeconds: 30
  timeoutSeconds: 10
  initialDelaySeconds: 30

livenessProbe:
  httpGet:
    path: /ping
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 60
  failureThreshold: 5

startupProbe:
  enabled: true
  httpGet:
    path: /ping
    port: 8000
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
  successThreshold: 1

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations:
  helm.sh/revision: '{{ .Release.Revision }}'

podSecurityContext: {}
  # fsGroup: 2000

containerSecurityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

nodeSelector: {}

tolerations: []

affinity: {}

updateStrategy:
  type: RollingUpdate

command: []
args: []

postgresCheckerInit:
  enabled: true
  image: jbergknoff/postgresql-client
  command:
  - 'sh'
  - '-c'
  - 'until pg_isready -U ${SPAR_BENE_PORTAL_API_DB_USERNAME} -h ${SPAR_BENE_PORTAL_API_DB_HOSTNAME} -p ${SPAR_BENE_PORTAL_API_DB_PORT:-5432} -d ${SPAR_BENE_PORTAL_API_DB_DBNAME:-spardb}; do sleep 3; done'

ingress:
  enabled: false
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: ""
      paths:
        - path: /api/bene-portal(/|$)(.*)
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

istio:
  enabled: true
  virtualservice:
    enabled: true
    host: "spar-bene-portal.openg2p.sandbox.net"
    gateway: "internal"
    destination: '{{ include "beneportal.fullname" . }}'
    destinationPort: '{{ .Values.service.port }}'
    prefix: '{{ tpl .Values.openapiRootPath $ }}/'
    rewriteUri: "/"
  gateway:
    enabled: false
    host: ""
    ingressController:
      istio: ingressgateway
    httpTlsRedirect: true
    httpEnabled: true
    httpsEnabled: false
    tls:
      mode: SIMPLE
      credentialName: ""

postgresqlInstallationName: '{{ .Release.Name }}-postgresql'
