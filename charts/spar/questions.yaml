questions:
# SPAR Mapper
- variable: sparHostname
  description: Hostname under which all SPAR services will be accessed
  type: string
  label: SPAR Hostname

- variable: sparMapperAPI.enabled
  description: Install SPAR Mapper
  type: boolean
  label: SPAR Mapper

# Beneficary portal
- variable: benePortalAPI.enabled
  description: Install Beneficiary Portal APIs
  type: boolean
  label: Beneficiary Portal API

- variable: benePortalAPI.benePortalHostname
  description: Domain name for Beneficiary Portal
  type: string
  label: Beneficiary Portal Domain Name

# eSignet
- variable: esignetBaseUrl
  description: Base URL of eSignet. SPAR will considered this eSignet as valid Authenticator.
  type: string
  label: eSignet Base URL

# Keycloak
- variable: keycloakBaseUrl
  description: Keycloak Base Url. Used for authentication of some API
  type: string
  label: Keycloak Base URL

- variable: sparAuthClientId
  description: OIDC Client ID for SPAR 
  type: string
  label: OIDC Client ID

- variable: sparAuthClientSecret
  description: OIDC Client Secret for SPAR 
  type: string
  label: OIDC Client Secret

# Keymanager
- variable: keymanagerInstallationName
  description: |-
    Internal service name of Keymanager
  type: reference_service
  label: Keymanager Service Name
  group: Keymanager Settings
