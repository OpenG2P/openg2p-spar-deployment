global:
  sparHostname: spar.sandbox.openg2p.net
  
  sparAuthClientId: 'openg2p-spar'
  sparAuthClientSecret: ''
  
  esignetBaseUrl: https://esignet.sandbox.openg2p.net
  
  keycloakBaseUrl: https://keycloak.openg2p.sandbox.net
  keycloakIssuerUrl: '{{ tpl .Values.global.keycloakBaseUrl $ }}/realms/master'

keymanagerInstallationName: openg2p-commons-keymanager

postgresql:
  enabled: true
  auth:
    username: sparuser
    database: spardb
  primary:
    extendedConfiguration: |-
      wal_level = logical
      max_wal_senders = 20
      max_replication_slots = 10

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: "*"
      gateway: ""
      matchPort: 5432
      destination: '{{ include "postgresql.v1.primary.fullname" .Subcharts.postgresql }}'
      destinationPort: "5432"
    gateway:
      enabled: true
      port: 5432
      host: "*"
      ingressController:
        istio: ingressgateway
      tls:
        enabled: false
        mode: SIMPLE
        credentialName: ""

bene-portal-api:
  enabled: true
  replicaCount: 1
  image:
    repository: openg2p/openg2p-spar-bene-portal-api
    pullPolicy: Always
    tag: "2.0.0"
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  envVars:
    SPAR_BENE_PORTAL_API_DB_HOSTNAME: '{{ .Release.Name }}-postgresql'
    SPAR_BENE_PORTAL_API_DB_PORT: '5432'
    SPAR_BENE_PORTAL_API_DB_DBNAME: 'spardb'
    SPAR_BENE_PORTAL_API_DB_USERNAME: 'sparuser'
  envVarsFrom:
    SPAR_BENE_PORTAL_API_DB_PASSWORD:
      secretKeyRef:
        name: '{{ .Release.Name }}-postgresql'
        key: password
  containerPort: 8000
  service:
    type: ClusterIP
    port: 80
  resources: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 80
  readinessProbe:
    httpGet:
      path: /ping
      port: 8000
    failureThreshold: 20
    periodSeconds: 30
    timeoutSeconds: 10
    initialDelaySeconds: 30
  livenessProbe:
    httpGet:
      path: /ping
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 60
    failureThreshold: 5
  serviceAccount:
    create: false
    annotations: {}
    name: ""
  podAnnotations:
    helm.sh/revision: '{{ .Release.Revision }}'
  podSecurityContext: {}
  containerSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  updateStrategy:
    type: RollingUpdate
  command: []
  args: []
  postgresCheckerInit:
    enabled: true
    image: jbergknoff/postgresql-client
    command:
    - 'sh'
    - '-c'
    - 'until pg_isready -U ${SPAR_BENE_PORTAL_API_DB_USERNAME} -h ${SPAR_BENE_PORTAL_API_DB_HOSTNAME} -p ${SPAR_BENE_PORTAL_API_DB_PORT:-5432} -d ${SPAR_BENE_PORTAL_API_DB_DBNAME:-spardb}; do sleep 3; done'
  ingress:
    enabled: false
    className: ""
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /$2
      kubernetes.io/ingress.class: nginx
    hosts:
      - host: ""
        paths:
          - path: /api/bene-portal(/|$)(.*)
            pathType: ImplementationSpecific
    tls: []
  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: ""
      gateway: "internal"
      destination: '{{ include "beneportal.fullname" . }}'
      destinationPort: '{{ .Values.service.port }}'
      prefix: /api/bene-portal/
      rewriteUri: "/"
    gateway:
      enabled: false
      host: ""
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: true
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

spar-mapper-api:
  enabled: true
  postgresql:
    enabled: false
  replicaCount: 1
  image:
    repository: openg2p/openg2p-spar-mapper-api
