      destinationPort: '{{ .Values.service.port }}'
      prefix: /selfservice
      rewriteUri: ""
    gateway:
      enabled: false
      host: ""
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: true
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

spar-self-service-api:
  enabled: true
  postgresql:
    enabled: false
  replicaCount: 1
  image:
    repository: openg2p/openg2p-spar-self-service-api
    pullPolicy: Always
    tag: "1.1.0"
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  envVars:
    SPAR_SELFSERVICE_DB_HOSTNAME: '{{ .Release.Name }}-postgresql'
    SPAR_SELFSERVICE_MAPPER_API_URL: 'http://{{ .Release.Name }}-spar-mapper-api/sync'
    SPAR_SELFSERVICE_AUTH_DEFAULT_ISSUERS: '["{{ .Values.global.esignetBaseUrl }}"]'
    SPAR_SELFSERVICE_AUTH_DEFAULT_JWKS_URLS: '["{{ .Values.global.esignetBaseUrl }}/.well-known/jwks.json"]'
    SPAR_SELFSERVICE_DB_USERNAME: "sparuser"
    SPAR_SELFSERVICE_DB_DBNAME: "spardb"
    SPAR_SELFSERVICE_OPENAPI_ROOT_PATH: "/api/selfservice"
    SPAR_SELFSERVICE_DEFAULT_ID_TOKEN_VERIFY_AT_HASH: "false"
  envVarsFrom:
    SPAR_SELFSERVICE_DB_PASSWORD:
      secretKeyRef:
        name: '{{ .Release.Name }}-postgresql'
  containerPort: 8000
  service:
    type: ClusterIP
    port: 80
  resources: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 80
  readinessProbe:
    httpGet:
      path: /ping
      port: 8000
    failureThreshold: 20
    periodSeconds: 30
    timeoutSeconds: 10
    initialDelaySeconds: 30
  livenessProbe:
    httpGet:
      path: /ping
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 60
    failureThreshold: 5
  serviceAccount:
    create: false
    annotations: {}
    name: ""
  podAnnotations:
    helm.sh/revision: '{{ .Release.Revision }}'
  podSecurityContext: {}
  containerSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  updateStrategy:
    type: RollingUpdate
  command: []
  args: []
  postgresCheckerInit:
    enabled: true
    image: jbergknoff/postgresql-client
    command:
    - 'sh'
    - '-c'
    - 'until pg_isready -U ${SPAR_SELFSERVICE_DB_USERNAME} -h ${SPAR_SELFSERVICE_DB_HOSTNAME} -p ${SPAR_SELFSERVICE_DB_PORT:-5432} -d ${SPAR_SELFSERVICE_DB_DBNAME:-spar_db}; do sleep 3; done'
  ingress:
    enabled: false
    className: ""
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /$2
      kubernetes.io/ingress.class: nginx
    hosts:
      - host: ""
        paths:
          - path: /api/selfservice(/|$)(.*)
            pathType: ImplementationSpecific
    tls: []
  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: ""
      gateway: "internal"
      destination: '{{ include "selfservice.fullname" . }}'
      destinationPort: '{{ .Values.service.port }}'
      prefix: /api/selfservice/
      rewriteUri: "/"
    gateway:
      enabled: false
      host: ""
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: true
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""
  postgresInit:
    enabled: true
    image: jbergknoff/postgresql-client
    imagePullPolicy: Always
    restartPolicy: Never
    envVars:
      GIT_REPO_URL: 'https://github.com/openg2p/openg2p-spar-self-service'
      GIT_BRANCH: 'develop'
      WAIT_BEFORE_STARTUP: 10s
    envVarsFrom: {}
    backoffLimit: 1
    command:
    - sh
    - -c
    - >-
      sleep $WAIT_BEFORE_STARTUP;
      apk --no-cache add bash gettext git;
      export DB_HOST=$SPAR_SELFSERVICE_DB_HOSTNAME;
      export DB_USER=$SPAR_SELFSERVICE_DB_USERNAME;
      export DB_USER_PASSWORD=$SPAR_SELFSERVICE_DB_PASSWORD;
      git_repo_name="$(basename "$GIT_REPO_URL" .git)";
      git clone --depth 1 --branch $GIT_BRANCH $GIT_REPO_URL &&
      cd $git_repo_name/db_scripts &&
      ./deploy.sh
    hookAnnotations:
      "helm.sh/hook": post-install,post-upgrade
      "helm.sh/hook-weight": "0"
      "helm.sh/hook-delete-policy": before-hook-creation
