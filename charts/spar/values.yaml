global:
  postgresqlHost: openg2p-commons-postgresql
  sparDB: '{{ .Release.Name }}_db'
  sparDBUser: '{{ .Release.Name }}_db_user'
  sparDBSecret: '{{ .Release.Name }}'
  sparDBUserPasswordKey: '{{ .Release.Name }}_db_user'

keycloakBaseUrl: https://keycloak.openg2p.org
keycloakIssuerUrl: '{{ tpl .Values.keycloakBaseUrl $ }}/realms/master'

sparAuthClientId: 'openg2p-spar'
sparAuthClientSecret: ''

esignetBaseUrl: https://esignet.sandbox.openg2p.net

  # Internal service name of Keymanager
keymanagerInstallationName: openg2p-commons-keymanager

postgres-init:
  enabled: true
  postgresql:
    host: '{{ .Values.global.postgresqlHost }}'
    port: 5432
    # Hard coding. Same as one defined under Odoo
    existingSecret: openg2p-commons-postgresql
    existingSecretPostgresPasswordKey: postgres-password
  databases:
    # Same as db in Odoo
    - name: '{{ tpl .Values.global.sparDB $ }}'
      user: '{{ tpl .Values.global.sparDBUser $ }}'
      secret: '{{ tpl .Values.global.sparDBSecret $ }}'
      secretUserPasswordKey: '{{ tpl .Values.global.sparDBUserPasswordKey $ }}'

sparMapperAPI:
  enabled: true
  sparHostname: spar.sandbox.openg2p.net
  postgresql:
    enabled: false
  replicaCount: 1
  image:
    repository: openg2p/openg2p-spar-mapper-api
    pullPolicy: Always
    tag: "1.1.0"
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  envVars:
    SPAR_MAPPER_API_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    SPAR_MAPPER_API_OAUTH_TOKEN_URL: '{{ tpl .Values.keycloakIssuerUrl $ }}/protocol/openid-connect/token'
    # TODO: Convert these to be stored in secret
    SPAR_MAPPER_API_OAUTH_CLIENT_ID: '{{ tpl .Values.sparAuthClientId $ }}'
    SPAR_MAPPER_API_OAUTH_CLIENT_SECRET: '{{ tpl .Values.sparAuthClientSecret $ }}'
    SPAR_MAPPER_API_JWT_VERIFY_URL: 'http://{{ .Values.keymanagerInstallationName }}/v1/keymanager/jwtVerify'
    SPAR_MAPPER_API_DB_DBNAME: '{{ tpl .Values.global.sparDB $ }}'
    SPAR_MAPPER_API_DB_USERNAME: '{{ tpl .Values.global.sparDBUser $ }}'
    SPAR_MAPPER_API_OPENAPI_ROOT_PATH: "/api/mapper"
  envVarsFrom:
    SPAR_MAPPER_API_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.sparDBSecret $ }}'
        key:  '{{ tpl .Values.global.sparDBUserPasswordKey $ }}'
  containerPort: 8000
  service:
    type: ClusterIP
    port: 80
  resources: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 80
  readinessProbe:
    httpGet:
      path: /ping
      port: 8000
    failureThreshold: 20
    periodSeconds: 30
    timeoutSeconds: 10
    initialDelaySeconds: 30
  livenessProbe:
    httpGet:
      path: /ping
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 60
    failureThreshold: 5
  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: 8000
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  serviceAccount:
    create: false
    annotations: {}
    name: ""
  podAnnotations:
    helm.sh/revision: '{{ .Release.Revision }}'
  podSecurityContext: {}
  containerSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  updateStrategy:
    type: RollingUpdate
  command: []
  args: []
  postgresCheckerInit:
    enabled: true
    image: jbergknoff/postgresql-client
    command:
    - 'sh'
    - '-c'
    - 'until pg_isready -U ${SPAR_MAPPER_API_DB_USERNAME} -h ${SPAR_MAPPER_API_DB_HOSTNAME} -p ${SPAR_MAPPER_API_DB_PORT:-5432} -d ${SPAR_MAPPER_API_DB_DBNAME:-spar_db}; do sleep 3; done'
  ingress:
    enabled: false
    className: ""
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /$2
      kubernetes.io/ingress.class: nginx
    hosts:
      - host: ""
        paths:
          - path: /api/mapper(/|$)(.*)
            pathType: ImplementationSpecific
    tls: []
  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: ""
      gateway: "internal"
      destination: '{{ include "common.names.fullname" $ }}-mapper-api'
      destinationPort: '{{ .Values.service.port }}'
      prefix: /api/mapper/
      rewriteUri: "/"
    gateway:
      enabled: false
      host: ""
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: true
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

