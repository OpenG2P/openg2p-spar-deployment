    pullPolicy: Always
    tag: "1.1.0"
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  envVars:
    NEXT_PUBLIC_BASE_PATH: /selfservice
    NEXT_PUBLIC_BASE_API_PATH: /api/selfservice
  envVarsFrom: {}
  containerPort: 3000
  service:
    type: ClusterIP
    port: 80
  resources: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 80
  readinessProbe:
    httpGet:
      path: /selfservice
      port: 3000
    failureThreshold: 20
    periodSeconds: 30
    timeoutSeconds: 10
    initialDelaySeconds: 30
  livenessProbe:
    httpGet:
      path: /selfservice
      port: 3000
    initialDelaySeconds: 15
    periodSeconds: 60
    failureThreshold: 5
  serviceAccount:
    create: false
    annotations: {}
    name: ""
  podAnnotations:
    helm.sh/revision: '{{ .Release.Revision }}'
  podSecurityContext: {}
  containerSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  updateStrategy:
    type: RollingUpdate
  command: []
  args: []
  ingress:
    enabled: false
    className: ""
    annotations:
      kubernetes.io/ingress.class: nginx
    hosts:
      - host: ""
        paths:
          - path: /selfservice
            pathType: ImplementationSpecific
    tls: []
  istio:
