global:
  postgresqlHost: commons-postgresql
  sparDB: '{{ printf "%s" .Release.Name | replace "-" "_" }}'
  sparDBUser: '{{ printf "%s_user" .Release.Name | replace "-" "_" }}'
  sparDBSecret: '{{ .Release.Name }}'
  sparDBUserPasswordKey: '{{ .Release.Name }}-db-user'

keycloakBaseUrl: https://keycloak2.openg2p.org
keycloakIssuerUrl: '{{ tpl .Values.keycloakBaseUrl $ }}/realms/master'

# This is the typical default name of the client and secret
sparAuthClientId: 'openg2p-spar-{{ .Release.Namespace }}'
# Name of the secret in Kuberentes containing (DO NOT password directly here)
# Same name as client id by convension.
sparAuthClientSecret: '{{ tpl .Values.sparAuthClientId $ }}'
# Key containing client password. Hardcoded in Keycloak Init script
sparAuthClientSecretKey: 'client_secret'

# Internal service name of Keymanager
keymanagerInstallationName: commons-keymanager

postgres-init:
  enabled: true
  postgresql:
    host: '{{ .Values.global.postgresqlHost }}'
    port: 5432
    # Hard coding. Same as one defined under Odoo
    existingSecret: commons-postgresql
    existingSecretPostgresPasswordKey: postgres-password
  databases:
    # Same as db in Odoo
    - name: '{{ tpl .Values.global.sparDB $ }}'
      user: '{{ tpl .Values.global.sparDBUser $ }}'
      secret: '{{ tpl .Values.global.sparDBSecret $ }}'
      secretUserPasswordKey: '{{ tpl .Values.global.sparDBUserPasswordKey $ }}'

sparMapperAPI:
  enabled: true
  sparHostname: spar.play.openg2p.net
  postgresql:
    enabled: false
  replicaCount: 1
  image:
    repository: openg2p/openg2p-spar-mapper-partner-api
    pullPolicy: Always
    tag: "2.1.0"
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  envVars:
    SPAR_MAPPER_PARTNER_API_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    SPAR_MAPPER_PARTNER_API_OAUTH_TOKEN_URL: '{{ tpl .Values.keycloakIssuerUrl $ }}/protocol/openid-connect/token'
    SPAR_MAPPER_PARTNER_API_OAUTH_CLIENT_ID: '{{ tpl .Values.sparAuthClientId $ }}'
    SPAR_MAPPER_PARTNER_API_JWT_VERIFY_URL: 'http://{{ .Values.keymanagerInstallationName }}/v1/keymanager/jwtVerify'
    SPAR_MAPPER_PARTNER_API_DB_DBNAME: '{{ tpl .Values.global.sparDB $ }}'
    SPAR_MAPPER_PARTNER_API_DB_USERNAME: '{{ tpl .Values.global.sparDBUser $ }}'
    SPAR_MAPPER_PARTNER_API_OPENAPI_ROOT_PATH: "/api/mapper"
  envVarsFrom:
    SPAR_MAPPER_PARTNER_API_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.sparDBSecret $ }}'
        key:  '{{ tpl .Values.global.sparDBUserPasswordKey $ }}'
    SPAR_MAPPER_PARTNER_API_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: '{{ tpl .Values.sparAuthClientSecret $ }}'
        key: '{{ tpl .Values.sparAuthClientSecretKey $ }}'

  containerPort: 8000
  service:
    type: ClusterIP
    port: 80
  resources: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 80
  readinessProbe:
    httpGet:
      path: /ping
      port: 8000
    failureThreshold: 20
    periodSeconds: 30
    timeoutSeconds: 10
    initialDelaySeconds: 30
  livenessProbe:
    httpGet:
      path: /ping
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 60
    failureThreshold: 5
  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: 8000
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  serviceAccount:
    create: false
    annotations: {}
    name: ""
  podAnnotations:
    helm.sh/revision: '{{ .Release.Revision }}'
  podSecurityContext: {}
  containerSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  updateStrategy:
    type: RollingUpdate
  command: []
  args: []
  postgresCheckerInit:
    enabled: true
    image: jbergknoff/postgresql-client
    command:
    - 'sh'
    - '-c'
    - 'until pg_isready -U ${SPAR_MAPPER_PARTNER_API_DB_USERNAME} -h ${SPAR_MAPPER_PARTNER_API_DB_HOSTNAME} -p ${SPAR_MAPPER_PARTNER_API_DB_PORT:-5432} -d ${SPAR_MAPPER_PARTNER_API_DB_DBNAME:-spar_db}; do sleep 3; done'
  ingress:
    enabled: false
    className: ""
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /$2
      kubernetes.io/ingress.class: nginx
    hosts:
      - host: ""
        paths:
          - path: /api/mapper(/|$)(.*)
            pathType: ImplementationSpecific
    tls: []
  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: ""
      gateway: "internal"
      destination: '{{ include "common.names.fullname" $ }}-mapper-api'
      destinationPort: '{{ .Values.service.port }}'
      prefix: /api/mapper/
      rewriteUri: "/"
    gateway:
      enabled: false
      host: ""
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: true
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

