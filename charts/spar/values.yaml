global:
  sparHostname: spar.sandbox.openg2p.net

  sparAuthClientId: 'openg2p-spar'
  sparAuthClientSecret: ''

  esignetBaseUrl: https://esignet.sandbox.openg2p.net

  keycloakBaseUrl: https://keycloak.openg2p.sandbox.net
  keycloakIssuerUrl: '{{ tpl .Values.global.keycloakBaseUrl $ }}/realms/master'
  sparKeymanagerInstallationName: '{{ .Release.Name }}-keymanager'

postgresql:
  enabled: true
  auth:
    username: sparuser
    database: spardb
  additionalDbs:
    enabled: true
    userPasswordsExistingSecret: ""
    userPasswords:
      keymgruser: ""
  primary:
    resourcesPreset: "small"
    extendedConfiguration: |-
      wal_level = logical
      max_wal_senders = 20
      max_replication_slots = 10

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: "*"
      gateway: ""
      matchPort: 5432
      destination: '{{ include "postgresql.v1.primary.fullname" .Subcharts.postgresql }}'
      destinationPort: "5432"
    gateway:
      enabled: true
      port: 5432
      host: "*"
      ingressController:
        istio: ingressgateway
      tls:
        enabled: false
        mode: SIMPLE
        credentialName: ""

spar-mapper-api:
  enabled: true
  postgresql:
    enabled: false
  envVars:
    SPAR_MAPPER_DB_HOSTNAME: '{{ .Release.Name }}-postgresql'

    # TODO: Convert these to be stored in secret
    SPAR_MAPPER_KEYMANAGER_API_BASE_URL: "http://{{ tpl .Values.global.sparKeymanagerInstallationName $ }}/v1/keymanager"
    SPAR_MAPPER_KEYMANAGER_AUTH_URL: '{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/token'
    SPAR_MAPPER_KEYMANAGER_AUTH_CLIENT_ID: '{{ tpl .Values.global.sparAuthClientId $ }}'
    SPAR_MAPPER_KEYMANAGER_AUTH_CLIENT_SECRET: '{{ tpl .Values.global.sparAuthClientSecret $ }}'

  envVarsFrom:
    SPAR_MAPPER_DB_PASSWORD:
      secretKeyRef:
        name: '{{ .Release.Name }}-postgresql'

spar-self-service-api:
  enabled: true
  postgresql:
    enabled: false
  envVars:
    SPAR_SELFSERVICE_DB_HOSTNAME: '{{ .Release.Name }}-postgresql'
    SPAR_SELFSERVICE_MAPPER_API_URL: 'http://{{ .Release.Name }}-spar-mapper-api/sync'
    SPAR_SELFSERVICE_AUTH_DEFAULT_ISSUERS: '["{{ .Values.global.esignetBaseUrl }}"]'
    SPAR_SELFSERVICE_AUTH_DEFAULT_JWKS_URLS: '["{{ .Values.global.esignetBaseUrl }}/.well-known/jwks.json"]'
  envVarsFrom:
    SPAR_SELFSERVICE_DB_PASSWORD:
      secretKeyRef:
        name: '{{ .Release.Name }}-postgresql'
  postgresInit:
    hookAnnotations:
      "helm.sh/hook-weight": "0"

spar-self-service-ui:
  enabled: true

artifactory:
  enabled: true
  image:
    repository: mosipid/artifactory-server
    tag: 1.4.1-ES
  resources: {}

softhsm:
  enabled: true
  # Hardcoding this for now. else every upgrade will reset the pin
  securityPIN: MzQwNTM0OTk=
  resources: {}

keymanager:
  enabled: true
  hostname: '{{ tpl .Values.global.sparHostname $ }}'
  springConfig:
    names: application,kernel
    profile: default
    gitRepo:
      enabled: true
      repoUrl: https://github.com/openg2p/mosip-config
      branch: master
    rawConfig: ""
  envVars:
    mosip_kernel_keymanager_autogen_appids_list: ROOT,SPAR
    mosip_kernel_keymanager_autogen_basekeys_list: 'SPAR:ENCRYPT'
    auth_server_admin_allowed_audience: 'openg2p-spar,openg2p-spar-{{ .Release.Namespace }}'
  envVarsFrom:
    db_dbuser_password:
      secretKeyRef:
        name: '{{ .Release.Name }}-postgresql-addl-user-passwords'
        key: keymgruser
  postgresInit:
    commonAnnotations:
      "helm.sh/hook-weight": "0"
    envVarsFrom:
      DBUSER_PWD:
        secretKeyRef:
          name: '{{ .Release.Name }}-postgresql-addl-user-passwords'
          key: keymgruser
  keygen:
    commonAnnotations:
      "helm.sh/hook-weight": "1"
