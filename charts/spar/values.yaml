  fullnameOverride: ""
  envVars:
    SPAR_MAPPER_API_DB_HOSTNAME: '{{ .Release.Name }}-postgresql'
    SPAR_MAPPER_API_OAUTH_TOKEN_URL: '{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/token'
    # TODO: Convert these to be stored in secret
    SPAR_MAPPER_API_OAUTH_CLIENT_ID: '{{ tpl .Values.global.sparAuthClientId $ }}'
    SPAR_MAPPER_API_OAUTH_CLIENT_SECRET: '{{ tpl .Values.global.sparAuthClientSecret $ }}'
    SPAR_MAPPER_API_JWT_VERIFY_URL: 'http://{{ .Values.keymanagerInstallationName }}/v1/keymanager/jwtVerify'
    SPAR_MAPPER_API_DB_USERNAME: "sparuser"
    SPAR_MAPPER_API_DB_DBNAME: "spardb"
    SPAR_MAPPER_API_OPENAPI_ROOT_PATH: "/api/mapper"
  envVarsFrom:
    SPAR_MAPPER_API_DB_PASSWORD:
      secretKeyRef:
        name: '{{ .Release.Name }}-postgresql'
        key: password
  containerPort: 8000
  service:
    type: ClusterIP
    port: 80
  resources: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 80
  readinessProbe:
    httpGet:
      path: /ping
      port: 8000
    failureThreshold: 20
    periodSeconds: 30
    timeoutSeconds: 10
    initialDelaySeconds: 30
  livenessProbe:
    httpGet:
      path: /ping
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 60
    failureThreshold: 5
  serviceAccount:
    create: false
    annotations: {}
    name: ""
  podAnnotations:
    helm.sh/revision: '{{ .Release.Revision }}'
  podSecurityContext: {}
  containerSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  updateStrategy:
    type: RollingUpdate
  command: []
  args: []
  postgresCheckerInit:
    enabled: true
    image: jbergknoff/postgresql-client
    command:
    - 'sh'
    - '-c'
    - 'until pg_isready -U ${SPAR_MAPPER_API_DB_USERNAME} -h ${SPAR_MAPPER_API_DB_HOSTNAME} -p ${SPAR_MAPPER_API_DB_PORT:-5432} -d ${SPAR_MAPPER_API_DB_DBNAME:-spar_db}; do sleep 3; done'
  ingress:
    enabled: false
    className: ""
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /$2
      kubernetes.io/ingress.class: nginx
    hosts:
      - host: ""
        paths:
          - path: /api/mapper(/|$)(.*)
            pathType: ImplementationSpecific
    tls: []
  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: ""
      gateway: "internal"
      destination: '{{ include "mapper.fullname" . }}'
      destinationPort: '{{ .Values.service.port }}'
      prefix: /api/mapper/
      rewriteUri: "/"
    gateway:
      enabled: false
      host: ""
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: true
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

