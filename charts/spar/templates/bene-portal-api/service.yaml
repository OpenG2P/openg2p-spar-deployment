{{- $values := index .Values "benePortalAPI" -}}
{{- $global := .Values.global -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "beneportal.fullname" . }}
  labels:
    {{- include "beneportal.labels" . | nindent 4 }}
spec:
  type: {{ $values.service.type }}
  ports:
    - port: {{ $values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "beneportal.selectorLabels" . | nindent 4 }}
