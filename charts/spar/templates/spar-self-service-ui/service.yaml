{{- $values := index .Values "spar-self-service-ui" -}}
{{- $global := .Values.global -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "selfserviceUi.fullname" . }}
  labels:
    {{- include "selfserviceUi.labels" . | nindent 4 }}
spec:
  type: {{ $values.service.type }}
  ports:
    - port: {{ $values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "selfserviceUi.selectorLabels" . | nindent 4 }}
