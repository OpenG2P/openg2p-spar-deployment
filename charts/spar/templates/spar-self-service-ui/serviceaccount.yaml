{{- $values := index .Values "spar-self-service-ui" -}}
{{- $global := .Values.global -}}
{{- if $values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "selfserviceUi.serviceAccountName" . }}
  labels:
    {{- include "selfserviceUi.labels" . | nindent 4 }}
  {{- with $values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
