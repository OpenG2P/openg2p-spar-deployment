{{- $values := index .Values "mapper-partner-api" -}}
{{- $global := .Values.global -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.names.fullname" $ }}-mapper-api
  labels:
    {{- include "mapper.labels" . | nindent 4 }}
spec:
  type: {{ $values.service.type }}
  ports:
    - port: {{ $values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "mapper.selectorLabels" . | nindent 4 }}
